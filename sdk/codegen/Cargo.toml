[package]
name = "encrypted-spaces-sdk-codegen"
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
encrypted-spaces-acl-types = { workspace = true }
encrypted-spaces-backend = { workspace = true }
# Cheap schema fingerprint to guard the pinned DATA_COMMITMENT against a stale
# app_schema.kdl (build-time check). Verify-only; no guest.
sha2 = { workspace = true }
hex = { workspace = true }
# --- compute path (regenerating the pinned constants) only ---
# These pull the in-process backend/server and the RISC-V guest build, so they
# are optional. The default (client) path reads both pinned constants from
# files (ENCRYPTED_SPACES_DATA_COMMITMENT_FILE / _FF_IMAGE_ID_FILE) and builds
# no guest. Regenerate the pins with `--features compute-commitment,local-guest-id`.
encrypted-spaces-sdk = { workspace = true, features = ["local-transport"], optional = true }
encrypted-spaces-ffproof = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "macros"], optional = true }

[features]
default = []
# Compute DATA_COMMITMENT from the schema by spinning up an in-process backend,
# instead of reading the pinned config/data_commitment.txt. Pulls the guest.
compute-commitment = ["dep:encrypted-spaces-sdk", "dep:tokio"]
# Derive FF_GUEST_IMAGE_ID from a locally-built guest, instead of reading the
# pinned config/ff_image_id.txt. Pulls the RISC-V guest build.
local-guest-id = ["dep:encrypted-spaces-ffproof", "encrypted-spaces-ffproof/prove"]

[dev-dependencies]
tempfile = "3"

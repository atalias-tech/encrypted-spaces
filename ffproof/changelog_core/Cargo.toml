[package]
name = "encrypted-spaces-changelog-core"
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
postcard = { workspace = true }
encrypted-spaces-acl-types = { workspace = true }
hex.workspace = true
instant.workspace = true
risc0-zkvm = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
rand = { workspace = true, features = ["os_rng"] }
serde = { workspace = true }
serde_json = { workspace = true }

merk = { workspace = true }

# `ffproof-tracer` pulls a RISC-V guest crate and is only needed for the
# `create_trace`/`create_trace_full` re-export (trace generation, prover/
# server side). Gated behind `prove` so verify-only consumers (every client)
# never build the guest. `ffproof-tracer-shared` is pure types (no guest).
ffproof-tracer = { path = "../tracer", optional = true }
ffproof-tracer-shared = { path = "../tracer/shared" }

# Storage encoding for key construction (users_row_key, etc.)
encrypted-spaces-storage-encoding = { workspace = true }

[features]
bench-timing = []
# Trace generation (create_trace/create_trace_full). Prover/server only;
# pulls the RISC-V guest tracer. Enabled by `ffproof/prove` and `backend/merk`.
prove = ["dep:ffproof-tracer"]

[dev-dependencies]
serde = { workspace = true }
tokio = { workspace = true }
